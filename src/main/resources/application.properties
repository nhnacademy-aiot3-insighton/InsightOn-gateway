spring.application.name=insighton-gateway
server.port=8080

jwt.public-key-base64=${JWT_PUBLIC_KEY}
spring.config.import=classpath:config/prod/actuator.properties, classpath:config/prod/swagger.properties


gateway-route.auth=http://insighton-auth
gateway-route.ai=http://insighton-ai
gateway-route.rule=http://insighton-ruleengine
gateway-route.core=http://insighton-core

server.shutdown=graceful





