spring.application.name=insighton-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,prometheus,gateway
spring.config.import=optional:configserver:http://insighton-config:8888

jwt.public-key-base64=${JWT_PUBLIC_KEY}

management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

spring.docker.compose.lifecycle-management=start_and_stop
spring.docker.compose.stop.command=down

management.endpoint.gateway.enabled=true

management.tracing.sampling.probability=1.0